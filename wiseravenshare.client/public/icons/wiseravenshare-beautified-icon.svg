<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <!-- Background Gradient: Deep Cosmic Purple to Night Blue -->
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f0923;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#1c113e;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#152845;stop-opacity:1" />
        </linearGradient>

        <!-- Brand Glow Gradient: Vibrant Magenta to Bright Cyan -->
        <linearGradient id="glow-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#835ff9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#46bfff;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="raven-fill" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
            <stop offset="80%" style="stop-color:#e0e5f2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#99a6cf;stop-opacity:1" />
        </linearGradient>

        <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>
    
    <!-- Outer App Icon Shape with Smooth Corners (Squircle-like) -->
    <rect x="0" y="0" width="1024" height="1024" rx="225" fill="url(#bg-gradient)" />
    
    <!-- Subtle Background Elements (Nodes / Network representing 'Share' and 'Truth') -->
    <circle cx="200" cy="200" r="150" fill="url(#glow-gradient)" opacity="0.1" filter="url(#soft-glow)"/>
    <circle cx="850" cy="850" r="300" fill="url(#glow-gradient)" opacity="0.1" filter="url(#soft-glow)"/>
    
    <g transform="translate(512, 512) scale(4.2) translate(-100, -100)" filter="url(#shadow)">
        <!-- Outer Glowing Ring -->
        <circle cx="100" cy="100" r="88" fill="none" stroke="url(#glow-gradient)" stroke-width="2" opacity="0.3" filter="url(#soft-glow)"/>
        <circle cx="100" cy="100" r="95" fill="none" stroke="url(#glow-gradient)" stroke-width="4" opacity="0.8" />
        <circle cx="100" cy="100" r="102" fill="none" stroke="url(#glow-gradient)" stroke-width="1" opacity="0.3" />

        <!-- Base Raven Path Base adapted and optimized -->
        <path d="M 100 30 
                 C 80 30, 60 45, 55 70 
                 C 50 85, 52 100, 60 110
                 C 55 105, 45 108, 40 115
                 C 35 122, 38 128, 45 128
                 C 50 128, 55 125, 58 120
                 C 65 130, 75 135, 85 138
                 C 80 145, 75 155, 78 165
                 C 80 170, 85 172, 90 168
                 C 92 165, 92 158, 90 150
                 C 100 152, 110 152, 120 150
                 C 118 158, 118 165, 120 168
                 C 125 172, 130 170, 132 165
                 C 135 155, 130 145, 125 138
                 C 135 135, 145 130, 152 120
                 C 155 125, 160 128, 165 128
                 C 172 128, 175 122, 170 115
                 C 165 108, 155 105, 150 110
                 C 158 100, 160 85, 155 70
                 C 150 45, 130 30, 100 30 Z" 
              fill="url(#raven-fill)" />
        
        <!-- The All-Seeing Eye of Truth -->
        <circle cx="80" cy="78" r="8" fill="url(#glow-gradient)" filter="url(#soft-glow)"/>
        <circle cx="80" cy="78" r="4" fill="#ffffff" />
        
        <!-- Subtle Beak Energy -->
        <path d="M 52 82 L 35 90 L 55 96" fill="none" stroke="url(#glow-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Refined Wing Details (Network Links style) -->
        <path d="M 70 85 L 85 105 L 80 135 M 130 85 L 115 105 L 120 135 M 85 105 L 115 105" fill="none" stroke="#2a1b4d" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
        <circle cx="85" cy="105" r="2" fill="url(#glow-gradient)" />
        <circle cx="115" cy="105" r="2" fill="url(#glow-gradient)" />
    </g>
</svg>
