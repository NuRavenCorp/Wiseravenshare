databases:
- engine: PG
  name: wiseravenshare-db
  version: "16"
domains:
- domain: wise-ravens.com
  type: PRIMARY
- domain: www.wise-ravens.com
  type: ALIAS
envs:
- key: Restricted
  scope: RUN_AND_BUILD_TIME
  value: REDACTED_FOR_GIT
- key: Publishable
  scope: RUN_AND_BUILD_TIME
  value: REDACTED_FOR_GIT
- key: Secrets
  scope: RUN_AND_BUILD_TIME
  value: REDACTED_FOR_GIT
ingress:
  rules:
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /api
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /health
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /weatherforecast
  - component:
      name: web
    match:
      path:
        prefix: /
name: wiseravenshare
region: nyc
services:
- envs:
  - key: ASPNETCORE_ENVIRONMENT
    scope: RUN_AND_BUILD_TIME
    value: Production
  - key: ASPNETCORE_URLS
    scope: RUN_AND_BUILD_TIME
    value: http://0.0.0.0:10000
  - key: CLIENT_ORIGIN
    scope: RUN_AND_BUILD_TIME
    value: ${web.PUBLIC_URL}
  - key: Authentication__AllowSelfRegistration
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: Authentication__Users__0__Name
    scope: RUN_AND_BUILD_TIME
