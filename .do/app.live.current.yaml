databases:
- cluster_name: wiseravenshare-db
  db_name: defaultdb
  db_user: wiseravenshare_app
  engine: PG
  name: wiseravenshare-db
  production: true
  version: "16"
domains:
- domain: wise-ravens.com
  type: PRIMARY
- domain: www.wise-ravens.com
  type: ALIAS
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /api
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /health
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /weatherforecast
  - component:
      name: web
    match:
      path:
        prefix: /
name: wiseravenshare
region: nyc
services:
- dockerfile_path: Wiseravenshare.Server/Dockerfile
