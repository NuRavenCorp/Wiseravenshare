name: wiseravenshare
region: nyc

# ── API service (ASP.NET Core / Docker) ──────────────────────────────────────
services:
  - name: api
    github:
      repo: NuRavenCorp/Wiseravenshare
      branch: main
      deploy_on_push: true
    dockerfile_path: Wiseravenshare.Server/Dockerfile
    source_dir: /
    http_port: 10000
    instance_size_slug: basic-xs
    instance_count: 1
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: CLIENT_ORIGIN
        value: ${web.PUBLIC_URL}
      - key: Admin__Emails
        value: admin@wise-ravens.com
      - key: Authentication__AllowSelfRegistration
        value: "true"
      - key: Authentication__Users__0__Name
        value: Wiseraven Admin
      - key: Authentication__Users__0__Email
        value: admin@wise-ravens.com
      - key: Authentication__Users__0__Password
        value: 1@Chinchin234
      - key: ConnectionStrings__DefaultConnection
        value: ${wiseravenshare-db.DATABASE_URL}
        type: SECRET
      - key: Persistence__RequireDatabase
        value: "true"
      - key: STRIPE_SECRET_KEY
        value: ${STRIPE_SECRET_KEY}
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        value: ${STRIPE_WEBHOOK_SECRET}
        type: SECRET
      - key: STRIPE_PRICE_MONTHLY_ID
        value: ${STRIPE_PRICE_MONTHLY_ID}
        type: SECRET
      - key: STRIPE_PRICE_ANNUAL_ID
        value: ${STRIPE_PRICE_ANNUAL_ID}
        type: SECRET
      - key: Social__Facebook__PageId
        value: ${SOCIAL_FACEBOOK_PAGE_ID}
        type: SECRET
      - key: Social__Facebook__PageAccessToken
        value: ${SOCIAL_FACEBOOK_PAGE_ACCESS_TOKEN}
        type: SECRET
      - key: Social__TikTok__Username
        value: ${SOCIAL_TIKTOK_USERNAME}
        type: SECRET
      - key: Social__TikTok__AccessToken
        value: ${SOCIAL_TIKTOK_ACCESS_TOKEN}
        type: SECRET
      - key: Social__Instagram__Username
        value: ${SOCIAL_INSTAGRAM_USERNAME}
        type: SECRET
      - key: Social__Instagram__ProfileUrl
        value: ${SOCIAL_INSTAGRAM_PROFILE_URL}
        type: SECRET
      - key: ReminderNotifications__Email__FromName
        value: ${REMINDER_EMAIL_FROM_NAME}
        type: SECRET
      - key: ReminderNotifications__Email__FromAddress
        value: ${REMINDER_EMAIL_FROM_ADDRESS}
        type: SECRET
      - key: ReminderNotifications__Email__SmtpHost
        value: ${REMINDER_EMAIL_SMTP_HOST}
        type: SECRET
      - key: ReminderNotifications__Email__SmtpPort
        value: ${REMINDER_EMAIL_SMTP_PORT}
        type: SECRET
      - key: ReminderNotifications__Email__EnableSsl
        value: ${REMINDER_EMAIL_ENABLE_SSL}
        type: SECRET
      - key: ReminderNotifications__Email__Username
        value: ${REMINDER_EMAIL_USERNAME}
        type: SECRET
      - key: ReminderNotifications__Email__Password
        value: ${REMINDER_EMAIL_PASSWORD}
        type: SECRET
      - key: ReminderNotifications__Sms__TwilioAccountSid
        value: ${TWILIO_ACCOUNT_SID}
        type: SECRET
      - key: ReminderNotifications__Sms__TwilioAuthToken
        value: ${TWILIO_AUTH_TOKEN}
        type: SECRET
      - key: ReminderNotifications__Sms__TwilioFromNumber
        value: ${TWILIO_FROM_NUMBER}
        type: SECRET

# ── Frontend static site ──────────────────────────────────────────────────────
static_sites:
  - name: web
    github:
      repo: NuRavenCorp/Wiseravenshare
      branch: main
      deploy_on_push: true
    source_dir: wiseravenshare.client
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    error_document: index.html
    envs:
      - key: VITE_API_URL
        value: ${api.PUBLIC_URL}/api
      - key: VITE_RAVENSIGHT_API_URL
        value: ${api.PUBLIC_URL}/api/ravensight
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: ${STRIPE_PUBLISHABLE_KEY}
      - key: VITE_ADMIN_EMAILS
        value: admin@wise-ravens.com

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /weatherforecast
      component:
        name: api
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: web

# ── Managed Postgres database ─────────────────────────────────────────────────
databases:
  - name: wiseravenshare-db
    cluster_name: wiseravenshare-db
    db_name: defaultdb
    db_user: wiseravenshare_app
    engine: PG
    version: "16"
    production: true

domains:
  - domain: wise-ravens.com
    type: PRIMARY
  - domain: www.wise-ravens.com
    type: ALIAS

