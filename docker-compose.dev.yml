version: '3.8'

# Local development environment with all optional services
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CLIENT_ORIGIN: http://localhost:10000,http://localhost:3000,https://localhost:50513
      AudioService__BaseUrl: http://audio-processor:8001
      KaraokeService__BaseUrl: http://karaoke-engine:8002
      KaraokeSpeechService__BaseUrl: http://karaoke-speech:8003
      VideoProcessorService__BaseUrl: http://video-processor:8004
    ports:
      - "10000:10000"

  # Enable local database
  postgres:
    profiles: []  # Remove from optional, make it default
    ports:
      - "5432:5432"

  # Enable AI assistant
  ollama:
    profiles: []  # Remove from optional, make it default
    ports:
      - "11434:11434"

  ollama-init:
    profiles: []  # Ensure model warmup runs by default in dev

  # Enable caching
  redis:
    profiles: []  # Remove from optional, make it default

  # Enable blob storage
  minio:
    profiles: []  # Remove from optional, make it default

  minio-init:
    profiles: []  # Remove from optional, make it default

  # Enable audio processing by default in dev
  audio-processor:
    ports:
      - "8001:8001"

  # Enable karaoke backing-track generation by default in dev
  karaoke-engine:
    ports:
      - "8002:8002"

  karaoke-speech:
    environment:
      SHERPA_MODEL_DIR: /app/models
      SHERPA_MODEL_URL: ${SHERPA_MODEL_URL:-}
      SHERPA_MODEL_BASE_URL: ${SHERPA_MODEL_BASE_URL:-https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-en-2023-06-26/resolve/main}
      SHERPA_TOKENS_PATH: ${SHERPA_TOKENS_PATH:-}
      SHERPA_ENCODER_PATH: ${SHERPA_ENCODER_PATH:-}
      SHERPA_DECODER_PATH: ${SHERPA_DECODER_PATH:-}
      SHERPA_JOINER_PATH: ${SHERPA_JOINER_PATH:-}
    ports:
      - "8003:8003"
