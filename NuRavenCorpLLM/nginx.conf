events { worker_connections 1024; }

http {
    # Define an active backend cluster pool mapping out your container nodes
    upstream llm_backend_cluster {
        # Least connections routing policy directs traffic to the least busy container
        least_conn;
        server inference-worker-1:8000;
        server inference-worker-2:8000;
    }

    server {
        listen 80;

        location /v1/generate {
            # Forward incoming requests directly to the least busy worker node
            proxy_pass http://llm_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Streaming LLM generation requires adjusting standard timeout constraints
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # Disable buffering so tokens stream back to users in real time
            proxy_buffering off;
        }
    }
}
