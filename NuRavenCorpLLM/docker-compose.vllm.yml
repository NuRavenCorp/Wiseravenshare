services:
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - ${VLLM_MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --guided-decoding-backend
      - ${GUIDED_DECODING_BACKEND:-outlines}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    ports:
      - "8001:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    gpus: all

  tentacle-wiseravenshare:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
      args:
        APP_USER: ${USERNAME:-arnol}
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
      GUIDED_DECODING_BACKEND: ${GUIDED_DECODING_BACKEND:-outlines}
      TENANT_ID: wiseravenshare
      PORT: 8000
    depends_on:
      - vllm
    ports:
      - "8101:8000"

  tentacle-wiseravenstream:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
      args:
        APP_USER: ${USERNAME:-arnol}
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
      GUIDED_DECODING_BACKEND: ${GUIDED_DECODING_BACKEND:-outlines}
      TENANT_ID: wiseravenstream
      PORT: 8000
    depends_on:
      - vllm
    ports:
      - "8102:8000"

  tentacle-voteralliance:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
      args:
        APP_USER: ${USERNAME:-arnol}
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
      GUIDED_DECODING_BACKEND: ${GUIDED_DECODING_BACKEND:-outlines}
      TENANT_ID: voteralliance
      PORT: 8000
    depends_on:
      - vllm
    ports:
      - "8103:8000"

volumes:
  hf_cache:
