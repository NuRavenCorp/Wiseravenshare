apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wiseravenstream
namePrefix: wiseravenstream-

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

configMapGenerator:
  - name: site-config
    literals:
      - SITE_KEY=wiseravenstream
      - SITE_NAME=WiseRavenStream
      - SITE_THEME=stream
      - SITE_DOMAIN=wiseravenstream-wiseravenstream.com
      - SPACES_BUCKET=nuravencorpllm-sites
      - SPACES_PREFIX=wiseravenstream
      - FolderKnowledge__RootPath=/data/sites

images:
  - name: registry.digitalocean.com/nuravencorpllm/api
    newTag: wiseravenstream
