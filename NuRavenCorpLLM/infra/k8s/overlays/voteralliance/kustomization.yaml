apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voteralliance
namePrefix: voteralliance-

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

configMapGenerator:
  - name: site-config
    literals:
      - SITE_KEY=voteralliance
      - SITE_NAME=VoterAlliance
      - SITE_THEME=civic
      - SITE_DOMAIN=voteralliance-voterallianceus.com
      - SPACES_BUCKET=nuravencorpllm-sites
      - SPACES_PREFIX=voteralliance
      - FolderKnowledge__RootPath=/data/sites

images:
  - name: registry.digitalocean.com/nuravencorpllm/api
    newTag: voteralliance
