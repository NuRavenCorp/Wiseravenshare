apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nu-raven
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nu-raven
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: sync-content
          image: amazon/aws-cli:2.17.45
          command:
            - sh
            - -c
            - >
              aws --endpoint-url https://${SPACES_ENDPOINT}
              s3 sync s3://${SPACES_BUCKET}/${SPACES_PREFIX}/ /data/sites
              --delete
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: site-secrets
          volumeMounts:
            - name: content
              mountPath: /data/sites
      containers:
        - name: api
          image: registry.digitalocean.com/nuravencorpllm/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
            - configMapRef:
                name: site-config
            - secretRef:
                name: site-secrets
          volumeMounts:
            - name: content
              mountPath: /data/sites
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: content
