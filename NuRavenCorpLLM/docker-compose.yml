services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nuraven-app
      POSTGRES_USER: nuraven_app
      POSTGRES_PASSWORD: nuraven-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: NuRavenCorpLLM.Server/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=nuraven-app;Username=nuraven_app;Password=nuraven-dev-password
      Redis__Configuration: redis:6379
      FolderKnowledge__RootPath: /data/sites
      FolderKnowledge__IncludeSubdirectories: true
      FolderKnowledge__ScanIntervalMinutes: 15
      FolderKnowledge__MaxFileCharacters: 200000
    ports:
      - "8080:8080"
    volumes:
      - "E:/NuRavenCorp123:/data/sites:ro"

  web:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  postgres_data:
