name: DigitalOcean PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

jobs:
  preview-deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger preview deployment
        env:
          APP_ID: ${{ secrets.DIGITALOCEAN_PREVIEW_APP_ID }}
        run: |
          echo "Deploying PR #${{ github.event.pull_request.number }} to DigitalOcean preview app"
          doctl apps create-deployment "$APP_ID" --wait

      - name: Show deployment status
        env:
          APP_ID: ${{ secrets.DIGITALOCEAN_PREVIEW_APP_ID }}
        run: |
          doctl apps list-deployments "$APP_ID" --format ID,Phase,CreatedAt --no-header | head
