version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wiseravenshare-db}
      POSTGRES_USER: ${POSTGRES_USER:-wiseravenshare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wiseravenshare_user} -d ${POSTGRES_DB:-wiseravenshare-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wiseravenshare-net
    profiles: ["local-db"]

  # Ollama AI Assistant (optional)
  ollama:
    image: ollama/ollama:latest
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - wiseravenshare-net
    profiles: ["with-ai"]

  ollama-init:
    image: ollama/ollama:latest
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      until ollama list >/dev/null 2>&1; do echo 'waiting for ollama...'; sleep 2; done;
      ollama pull ${OLLAMA_DEFAULT_MODEL:-llama3.2}
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - wiseravenshare-net
    profiles: ["with-ai"]

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - wiseravenshare-net
    profiles: ["with-cache"]

  # MinIO S3-compatible Object Storage (optional)
  minio:
    image: minio/minio:latest
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - wiseravenshare-net
    profiles: ["with-storage"]

  # MinIO initialization (create buckets)
  minio-init:
    image: minio/mc:latest
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-minio-init
    profiles: ["with-storage"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin123} &&
      mc mb -p local/${BLOB_BUCKET_NAME:-wiseravenshare-dev} || true &&
      mc anonymous set download local/${BLOB_BUCKET_NAME:-wiseravenshare-dev} || true
      "
    networks:
      - wiseravenshare-net

  # Stripe Webhook Forwarder (optional, for local testing)
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-stripe-cli
    restart: unless-stopped
    profiles: ["with-stripe"]
    depends_on:
      - api
    command: >
      listen
      --api-key ${STRIPE_SECRET_KEY}
      --forward-to http://api:10000/api/payments/webhook
    networks:
      - wiseravenshare-net

  # Audio cleanup microservice (FastAPI container)
  audio-processor:
    build:
      context: ./services/audio-processor
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-audio-processor
    restart: unless-stopped
    expose:
      - "8001"
    networks:
      - wiseravenshare-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Karaoke backing-track microservice (FastAPI container)
  karaoke-engine:
    build:
      context: ./services/karaoke-engine
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-karaoke-engine
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      XDG_CACHE_HOME: /cache
      TORCH_HOME: /cache/torch
      HF_HOME: /cache/huggingface
    volumes:
      - karaoke-cache:/cache
    networks:
      - wiseravenshare-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  karaoke-speech:
    build:
      context: ./services/karaoke-speech
      dockerfile: Dockerfile
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-karaoke-speech
    restart: unless-stopped
    environment:
      SHERPA_MODEL_DIR: ${SHERPA_MODEL_DIR:-/app/models}
      SHERPA_MODEL_URL: ${SHERPA_MODEL_URL:-}
      SHERPA_TOKENS_PATH: ${SHERPA_TOKENS_PATH:-}
      SHERPA_ENCODER_PATH: ${SHERPA_ENCODER_PATH:-}
      SHERPA_DECODER_PATH: ${SHERPA_DECODER_PATH:-}
      SHERPA_JOINER_PATH: ${SHERPA_JOINER_PATH:-}
    expose:
      - "8003"
    networks:
      - wiseravenshare-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # HLS video segmentation microservice (FastAPI container)
  video-processor:
    build:
      context: ./services/video-processor
      dockerfile: Dockerfile
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-video-processor
    expose:
      - "8004"
    environment:
      SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      SPACES_REGION: ${DO_SPACES_REGION:-nyc3}
      SPACES_ACCESS_KEY: ${DO_SPACES_ACCESS_KEY:-}
      SPACES_SECRET_KEY: ${DO_SPACES_SECRET_KEY:-}
      SPACES_BUCKET: ${SPACES_BUCKET:-bucket-wrs-01010}
      SPACES_CDN_BASE_URL: ${DO_CDN_PUBLIC_BASE_URL:-}
    networks:
      - wiseravenshare-net

  # Main API Server (builds and runs .NET + React app)
  api:
    build:
      context: .
      dockerfile: ./Wiseravenshare.Server/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:10000}
        VITE_RAVENSIGHT_API_URL: ${VITE_RAVENSIGHT_API_URL:-http://localhost:10000/api/ravensight}
    container_name: ${WS_CONTAINER_PREFIX:-wiseravenshare}-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      audio-processor:
        condition: service_healthy
        required: false
      karaoke-engine:
        condition: service_healthy
        required: false
      karaoke-speech:
        condition: service_healthy
        required: false
      video-processor:
        condition: service_started
        required: false
      ollama:
        condition: service_healthy
        required: false
      ollama-init:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_started
        required: false
      minio:
        condition: service_started
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:10000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:10000,http://localhost:3000}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      JWT_highentropykey: ${JWT_highentropykey:-WRS_Development_JWT_Secret_2026_Change_Me_1234567890}
      Authentication__Jwt__Key: ${Authentication__Jwt__Key:-WRS_Development_JWT_Secret_2026_Change_Me_1234567890}
      # Database
      ConnectionStrings__DefaultConnection: ${EXTERNAL_POSTGRES_CONNECTION:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-wiseravenshare-db};Username=${POSTGRES_USER:-wiseravenshare_user};Password=${POSTGRES_PASSWORD:-CHANGE_ME};SSL Mode=Disable;Trust Server Certificate=true}
      # Ollama AI
      AiProvider: ${AI_PROVIDER:-gradient}
      Gradient__BaseUrl: ${GRADIENT_BASE_URL:-https://ingress.do-ai.run/v1}
      Gradient__DefaultModel: ${GRADIENT_DEFAULT_MODEL:-gpt-4o-mini}
      Gradient__InferenceKey: ${GRADIENT_INFERENCE_KEY:-}
      # Media microservices
      AudioService__BaseUrl: ${AUDIO_SERVICE_BASE_URL:-http://audio-processor:8001}
      KaraokeService__BaseUrl: ${KARAOKE_SERVICE_BASE_URL:-http://karaoke-engine:8002}
      KaraokeSpeechService__BaseUrl: ${KARAOKE_SPEECH_SERVICE_BASE_URL:-http://karaoke-speech:8003}
      VideoProcessorService__BaseUrl: http://video-processor:8004
      # Redis Cache
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      # S3 Blob Storage
      Storage__Blob__BucketName: ${BLOB_BUCKET_NAME:-wiseravenshare-dev}
      Storage__Blob__ProjectFolder: ${BLOB_PROJECT_FOLDER:-wiseravenshare}
      Storage__Blob__SiteName: ${BLOB_SITE_NAME:-wiseravenshare}
      S3__Endpoint: ${S3_ENDPOINT:-http://minio:9000}
      S3__AccessKey: ${S3_ACCESS_KEY:-minioadmin}
      S3__SecretKey: ${S3_SECRET_KEY:-minioadmin123}
      S3__ForcePathStyle: ${S3_FORCE_PATH_STYLE:-true}
      S3__Region: ${S3_REGION:-us-east-1}
      # Stripe
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${API_PORT:-10000}:10000"
    networks:
      - wiseravenshare-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  ollama-models:
  minio-data:
  karaoke-cache:

networks:
  wiseravenshare-net:
    driver: bridge
