services:
  postgres:
    image: postgres:16-alpine
    container_name: wiseravenshare-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wiseravenshare_db}
      POSTGRES_USER: ${POSTGRES_USER:-wiseravenshare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wiseravenshare_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wiseravenshare-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wiseravenshare_user} -d ${POSTGRES_DB:-wiseravenshare_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/Dockerfile.api
    container_name: wiseravenshare-dev-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-matrix-api:
        condition: service_healthy
      python-live-ranker:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:10000
      Authentication__Jwt__Key: ${Authentication__Jwt__Key:-dev-only-change-this-secret-at-least-32-characters}
      App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:-http://localhost:10000}
      Persistence__RequireDatabase: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-wiseravenshare_db};Username=${POSTGRES_USER:-wiseravenshare_user};Password=${POSTGRES_PASSWORD:-wiseravenshare_dev_password};SSL Mode=Disable;Trust Server Certificate=true
      PythonMatrixService__BaseUrl: ${PYTHON_MATRIX_BASE_URL:-http://python-matrix-api:8005}
      PythonLiveRankerService__BaseUrl: ${PYTHON_LIVE_RANKER_BASE_URL:-http://python-matrix-api:8005}
      PythonPostRankerService__BaseUrl: ${PYTHON_POST_RANKER_BASE_URL:-http://python-matrix-api:8005}
      PythonServices__Enabled: "false"
    ports:
      - "${API_PORT:-10000}:10000"

  python-matrix-api:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-python-matrix-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 8005
      DATABASE_URL: postgresql://${POSTGRES_USER:-wiseravenshare_user}:${POSTGRES_PASSWORD:-wiseravenshare_dev_password}@postgres:5432/${POSTGRES_DB:-wiseravenshare_db}
      NURAVEN_CORP_LLM_SCORER_URL: ${NURAVEN_CORP_LLM_SCORER_URL:-}
      RANKER_MODEL_TIMEOUT_SECONDS: ${RANKER_MODEL_TIMEOUT_SECONDS:-1.5}
      REDIS_URL: ${PYTHON_REDIS_URL:-redis://redis:6379/0}
      QUEUE_TOPICS_ENABLED: "true"
      POST_FEED_TOPIC: ${POST_FEED_TOPIC:-post.feed.ranked}
      LIVE_FEED_TOPIC: ${LIVE_FEED_TOPIC:-live.feed.ranked}
      LIVE_TRAINING_TOPIC: ${LIVE_TRAINING_TOPIC:-live.training.data}
      ENGAGEMENT_ACTION_TOPIC: ${ENGAGEMENT_ACTION_TOPIC:-engagement.action}
      TAGS_TOPIC: ${TAGS_TOPIC:-worker.tags}
      AUDIO_TOPIC: ${AUDIO_TOPIC:-worker.audio}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      - "${PYTHON_MATRIX_PORT:-8005}:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8005/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  python-post-ranker:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-python-post-ranker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wiseravenshare_user}:${POSTGRES_PASSWORD:-wiseravenshare_dev_password}@postgres:5432/${POSTGRES_DB:-wiseravenshare_db}
      NURAVEN_CORP_LLM_SCORER_URL: ${NURAVEN_CORP_LLM_SCORER_URL:-}
      RANKER_MODEL_TIMEOUT_SECONDS: ${RANKER_MODEL_TIMEOUT_SECONDS:-1.5}
      REDIS_URL: ${PYTHON_REDIS_URL:-redis://redis:6379/0}
      JOB_TOPIC: ${POST_FEED_TOPIC:-post.feed.ranked}
      HANDLER_NAME: post_feed_ranked
    command: ["python", "job_worker.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; redis.Redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0')).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  python-live-ranker:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-python-live-ranker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wiseravenshare_user}:${POSTGRES_PASSWORD:-wiseravenshare_dev_password}@postgres:5432/${POSTGRES_DB:-wiseravenshare_db}
      NURAVEN_CORP_LLM_SCORER_URL: ${NURAVEN_CORP_LLM_SCORER_URL:-}
      RANKER_MODEL_TIMEOUT_SECONDS: ${RANKER_MODEL_TIMEOUT_SECONDS:-1.5}
      REDIS_URL: ${PYTHON_REDIS_URL:-redis://redis:6379/0}
      JOB_TOPIC: ${LIVE_FEED_TOPIC:-live.feed.ranked}
      HANDLER_NAME: live_feed
    command: ["python", "job_worker.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; redis.Redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0')).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  python-live-training-worker:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-python-live-training-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wiseravenshare_user}:${POSTGRES_PASSWORD:-wiseravenshare_dev_password}@postgres:5432/${POSTGRES_DB:-wiseravenshare_db}
      REDIS_URL: ${PYTHON_REDIS_URL:-redis://redis:6379/0}
      JOB_TOPIC: ${LIVE_TRAINING_TOPIC:-live.training.data}
      HANDLER_NAME: live_training_data
    command: ["python", "job_worker.py"]

  python-engagement-worker:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-python-engagement-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_URL: ${PYTHON_REDIS_URL:-redis://redis:6379/0}
      JOB_TOPIC: ${ENGAGEMENT_ACTION_TOPIC:-engagement.action}
      HANDLER_NAME: engagement_action
    command: ["python", "job_worker.py"]

  worker-tags:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-worker-tags
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_URL: ${PYTHON_REDIS_URL:-redis://redis:6379/0}
      JOB_TOPIC: ${TAGS_TOPIC:-worker.tags}
      HANDLER_NAME: worker_tags
    command: ["python", "job_worker.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; redis.Redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0')).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-audio:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-worker-audio
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_URL: ${PYTHON_REDIS_URL:-redis://redis:6379/0}
      JOB_TOPIC: ${AUDIO_TOPIC:-worker.audio}
      HANDLER_NAME: worker_audio
    command: ["python", "job_worker.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; redis.Redis.from_url(os.getenv('REDIS_URL','redis://redis:6379/0')).ping()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  python-metrics-aggregator:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-python-metrics-aggregator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      REDIS_URL: ${PYTHON_REDIS_URL:-redis://redis:6379/0}
      PG_DSN: ${PYTHON_PG_DSN:-postgresql://wiseravenshare_user:wiseravenshare_dev_password@postgres:5432/wiseravenshare_db}
      AGGREGATE_MODE: loop
      AGGREGATE_LOOP_SECONDS: ${AGGREGATE_LOOP_SECONDS:-600}
    command: ["python", "aggregate.py"]

  python-metrics-api:
    build:
      context: ..
      dockerfile: wiseravenshare.Server/python-matrix/Dockerfile
    container_name: wiseravenshare-dev-python-metrics-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PYTHON_METRICS_API_PORT:-8010}
      PG_DSN: ${PYTHON_PG_DSN:-postgresql://wiseravenshare_user:wiseravenshare_dev_password@postgres:5432/wiseravenshare_db}
    command: ["uvicorn", "metrics_api:app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "${PYTHON_METRICS_API_PORT:-8010}:8010"

  redis:
    image: redis:7-alpine
    container_name: wiseravenshare-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  wiseravenshare-dev-postgres:
